openapi: 3.0.1
info:
  title: Car API Documentation
  description: API for managing cars in the Protogen system.
  version: 1.0.0

paths:
  /cars:
    post:
      operationId: addCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarDTO'
      responses:
        '201':
          description: Car added successfully

    get:
      operationId: getAllCars
      responses:
        '200':
          description: Cars returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarDTO'

  /cars/vin/{vin}:
    get:
      summary: Return a car by vin
      operationId: getCarById
      parameters:
        - name: vin
          in: path
          description: vin of a car to be returned
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Car returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDTO'
        '404':
          description: Car not found


    delete:
      summary: Remove a car by vin
      operationId: removeCarById
      parameters:
        - name: vin
          in: path
          description: vin of a car to be removed
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Car removed successfully
        '404':
          description: Car not found

    put:
      summary: update a car identified by vin
      operationId: updateCar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarDTO'
      parameters:
        - name: vin
          in: path
          description: vin of a car to be updated
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Car updated successfully
        '404':
          description: Car not found

  /cars/make/{make}:
    get:
      summary: Return cars identified by make
      operationId: getCarByMake
      parameters:
        - name: make
          in: path
          description: make of cars to be returned
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Car returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarDTO'
        '404':
          description: Car not found

  /cars/color/{color}:
    get:
      summary: Return cars by  color
      operationId: getCarByColor
      parameters:
        - name: color
          in: path
          description: color of cars to returned
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cars returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarDTO'
        '404':
          description: Car not found

  /cars/year/{year}:
    get:
      summary: Return cars by year
      operationId: getCarByYear
      parameters:
        - name: year
          in: path
          description: year of cars to returned
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operation successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarDTO'
        '404':
          description: Car not found

  /cars/searchCars:
    get:
      operationId: searchCars
      parameters:
        - name: make
          in: query
          description: make of a car to be searched
          required: false
          schema:
            type: string
        - name: model
          in: query
          description: model of a car to be searched
          required: false
          schema:
            type: string
        - name: color
          in: query
          description: color of a car to be searched
          required: false
          schema:
            type: string
        - name: price
          in: query
          description: price of a car to be searched
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Cars returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarDTO'
        '404':
          description: Car not found

components:
  schemas:
    CarDTO:
      type: object
      properties:
        vin:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        engine:
          type: string
        transmission:
          type: string
        fuelType:
          type: string
        mileage:
          type: integer
        price:
          type: integer
        ownerId:
          type: integer
        features:
          type: array
          items:
            type : string

server.port=9102

spring.application.name=cars-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehicle_cars}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.connection-timeout=60000

spring.cloud.config.uri=http://localhost:9001
spring.cloud.config.enabled=true
spring.cloud.compatibility-verifier.enabled=false
spring.config.import=optional:configserver:http://localhost:9001
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework=DEBUG
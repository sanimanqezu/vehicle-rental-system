openapi: 3.0.1
info:
  title: Reservation API
  description: API for managing reservations in the Protogen system.
  version: 1.0.0
paths:
  /reservations:
    post:
      summary: Add a new reservation
      requestBody:
        description: Reservation data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationDTO'
      responses:
        '200':
          description: Reservation added successfully
          content:
            application/json:
              schema:
                type: string

    get:
      summary: Get all reservations
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationDTO'

  /reservations/id/{id}:
    get:
      summary: Get reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDTO'

    delete:
      summary: Remove reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reservation removed successfully
          content:
            application/json:
              schema:
                type: string

    put:
      summary: Update reservation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Updated reservation data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationDTO'
      responses:
        '200':
          description: Reservation updated successfully
          content:
            application/json:
              schema:
                type: string

  /reservations/search:
    get:
      summary: Search reservations by parameters
      parameters:
        - name: id
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: carId
          in: query
          schema:
            type: integer
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: pickUpLocation
          in: query
          schema:
            type: string
        - name: dropOffLocation
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of matching reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationDTO'

components:
  schemas:
    ReservationDTO:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the reservation
        userId:
          type: integer
          description: ID of the user who made the reservation
        carId:
          type: integer
          description: ID of the reserved car
        fromDate:
          type: string
          format: date
          description: Start date of the reservation
        toDate:
          type: string
          format: date
          description: End date of the reservation
        pickUpLocation:
          type: string
          description: Pick-up location of the car
        dropOffLocation:
          type: string
          description: Drop-off location of the car

spring.application.name=AuthorizationServerConfig

server.port=8080

spring.security.oauth2.authorizationserver.client.client-1.registration.client-id=client
spring.security.oauth2.authorizationserver.client.client-1.registration.client-secret={bcrypt}$2a$10$AbCdEf1234567890QRSstuVWxYz1234567890abcdefABCDEF0123456
spring.security.oauth2.authorizationserver.client.client-1.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.client-1.registration.authorization-grant-types=authorization_code,client_credentials,refresh_token
spring.security.oauth2.authorizationserver.client.client-1.registration.redirect-uris=http://localhost:7000/login/oauth2/code/spring
spring.security.oauth2.authorizationserver.client.client-1.registration.scopes=openid,user_read,user_write
spring.security.oauth2.authorizationserver.client.client-1.require-authorization-consent=true
spring.security.oauth2.authorizationserver.client.client-1.token.access-token-time-to-live=PT10M

logging.level.org.springframework.security=DEBUG
spring.cloud.config.uri = http://localhost:9001
spring.cloud.config.enabled = true
spring.cloud.compatibility-verifier.enabled = false
spring.config.import = optional:configserver:http://localhost:9001
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring:
  cloud:
    gateway:
      routes:
        - id: reservation-service
          uri: lb://RESERVATION-SERVICE
          predicates:
            - Path=/reservations/**
          filters:
            - StripPrefix=1

        - id: car-service
          uri: lb://CAR-SERVICE
          predicates:
            - Path=/cars/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1